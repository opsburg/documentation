name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# The newest deploy wins. Pull requests only build, each in its own group, so
# they never cancel a deploy.
concurrency:
  group: ${{ github.event_name == 'pull_request' && format('pages-pr-{0}', github.ref) || 'pages' }}
  cancel-in-progress: true

# The scanners run from their official images at a pinned version, not through
# third-party actions: gitleaks-action needs a licence for organization repos,
# and trivy-action had its tags rewritten in a 2026 supply-chain attack.
# Dependabot does not see these two, so bump them by hand.
env:
  GITLEAKS_VERSION: v8.30.1
  TRIVY_VERSION: 0.76.1

jobs:
  # Nothing is built or deployed unless both scans pass.
  security:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          # Gitleaks reads the whole history: a secret removed in a later
          # commit is still published.
          fetch-depth: 0

      - name: Gitleaks, secrets in the code and its history
        run: >-
          docker run --rm -v "$PWD:/repo" ghcr.io/gitleaks/gitleaks:$GITLEAKS_VERSION
          git /repo --redact --no-banner --verbose

      # HIGH and CRITICAL with a fix available fail the run; the fix is an
      # upgrade, or an override in pnpm-workspace.yaml for a transitive dependency.
      - name: Trivy, known vulnerabilities in the dependencies
        run: >-
          docker run --rm -v "$PWD:/src" ghcr.io/aquasecurity/trivy:$TRIVY_VERSION
          fs /src --scanners vuln --severity HIGH,CRITICAL --ignore-unfixed
          --exit-code 1 --no-progress

  build:
    needs: security
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          # The whole history: page "last updated" dates and sitemap lastmod come from git.
          fetch-depth: 0

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 10

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "26"
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm typecheck

      - name: Build
        run: pnpm run build

      - name: Upload artifact
        if: github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v5
        with:
          path: ./build
          # Keeps static/.nojekyll in the published site.
          include-hidden-files: true

  deploy:
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Setup Pages
        uses: actions/configure-pages@v6

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
